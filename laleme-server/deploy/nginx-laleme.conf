server {
    listen 80;
    server_name api.laleme.ariel.today;

    # 80 端口目前被云厂商按域名拦截（403 Non-compliance ICP Filing），
    # 这里的跳转只在拦截解除后才有意义；证书走 443 的 TLS-ALPN 签发，不依赖 80。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.laleme.ariel.today;

    ssl_certificate     /etc/nginx/ssl/api.laleme.ariel.today.pem;
    ssl_certificate_key /etc/nginx/ssl/api.laleme.ariel.today.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
